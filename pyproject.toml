[project]
name = "wk"
version = "0.1.0"
description = "Worktree TUI - Interactive worktree management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=0.47.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4.0",
    "ty>=0.0.1a0",
]

[project.scripts]
wk = "wk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Ty configuration
[tool.ty.environment]
python-version = "3.13"
